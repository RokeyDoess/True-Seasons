# Only normal/overworld dimensions are eligible. Empty list includes all overworlds.
worlds: []
announcements:
  # A short, unprefixed season-start message to all online players.
  season-start: true
  # Migration start/completion notices to admins and operators, with [True Seasons].
  # Completion waits for terrain work and pending BlueMap updates.
  migration: true
migration:
  enabled: true
  # Async loads in flight, shared by migration and cleanup.
  max-concurrent-chunks: 2
  # Limit application work as well as concurrent loading.
  max-chunks-per-tick: 1
  max-millis-per-tick: 3.0
  pause-below-tps: 18.5
  # Legacy setting retained for compatibility. Storms now follow visible chunks.
  player-radius-chunks: 4
  # Complete one saved region before moving to the next, independent of players.
  # Wait this many seconds after a background check before starting another.
  rescan-seconds: 300
  # Informational invariant: True Seasons never offers generation-enabled loads.
  generate-missing-chunks: false
climate:
  # Hot biomes retain their normal grass and leaf appearances during autumn.
  autumn-excluded-biome-fragments: [desert, badlands, savanna, jungle, warm_ocean]
  # Match fragments of biome registry keys. [] permits winter in all biomes.
  winter-excluded-biome-fragments: [desert, badlands, savanna, jungle, warm_ocean]
  # Cold biomes keep their normal colours during summer.
  summer-excluded-biome-fragments: [snowy, frozen, ice_spikes, grove, jagged_peaks, cold_ocean]
